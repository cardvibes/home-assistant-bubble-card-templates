battery_status:
  card:
    type: custom:bubble-card
    card_type: button
    entity: '[[entity]]'
    name: '[[name]]'
    icon: >
      ${states['[[entity]]'].state >= 90 ? 'mdi:battery' :
        states['[[entity]]'].state >= 80 ? 'mdi:battery-90' :
        states['[[entity]]'].state >= 70 ? 'mdi:battery-80' :
        states['[[entity]]'].state >= 60 ? 'mdi:battery-70' :
        states['[[entity]]'].state >= 50 ? 'mdi:battery-60' :
        states['[[entity]]'].state >= 40 ? 'mdi:battery-50' :
        states['[[entity]]'].state >= 30 ? 'mdi:battery-40' :
        states['[[entity]]'].state >= 20 ? 'mdi:battery-30' :
        states['[[entity]]'].state >= 10 ? 'mdi:battery-20' :
        'mdi:battery-alert'}
    show_state: true
    state_color: true
    styles:
      .bubble-button-background:
        background-color: >
          ${states['[[entity]]'].state >= 75 ? 'green' :
            states['[[entity]]'].state >= 50 ? 'yellow' :
            states['[[entity]]'].state >= 25 ? 'orange' :
            'red'}
    tap_action:
        action: more-info
